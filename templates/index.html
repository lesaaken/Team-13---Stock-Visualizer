<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Data Visualizer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 30px; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; padding: 25px 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        select, input[type="date"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 15px; box-sizing: border-box; }
        button { background: #2563eb; color: #fff; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background: #1d4ed8; }
        .error-box { background: #fee2e2; border-left: 4px solid #dc2626; color: #991b1b; padding: 12px 16px; margin-bottom: 20px; border-radius: 4px; }
        .chart-container { margin-top: 30px; text-align: center; }
        .chart-container embed, .chart-container svg { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stock Data Visualization Tool</h1>
        {% if errors %}
        <div class="error-box">
            <strong>Please fix the following errors:</strong>
            <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
        </div>
        {% endif %}
        <form method="POST" action="/">
            <div class="form-group">
                <label for="symbol">Stock Symbol:</label>
                <select name="symbol" id="symbol">
                    <option value="">-- Select a Symbol --</option>
                    {% for sym in symbols %}
                    <option value="{{ sym }}" {% if form_data.symbol == sym %}selected{% endif %}>{{ sym }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="chart_type">Chart Type:</label>
                <select name="chart_type" id="chart_type">
                    <option value="">-- Select Chart Type --</option>
                    <option value="bar" {% if form_data.chart_type == 'bar' %}selected{% endif %}>1. Bar</option>
                    <option value="line" {% if form_data.chart_type == 'line' %}selected{% endif %}>2. Line</option>
                </select>
            </div>
            <div class="form-group">
                <label for="time_series">Time Series:</label>
                <select name="time_series" id="time_series">
                    <option value="">-- Select Time Series --</option>
                    <option value="TIME_SERIES_INTRADAY" {% if form_data.time_series == 'TIME_SERIES_INTRADAY' %}selected{% endif %}>1. Intraday (60min)</option>
                    <option value="TIME_SERIES_DAILY" {% if form_data.time_series == 'TIME_SERIES_DAILY' %}selected{% endif %}>2. Daily</option>
                    <option value="TIME_SERIES_WEEKLY" {% if form_data.time_series == 'TIME_SERIES_WEEKLY' %}selected{% endif %}>3. Weekly</option>
                    <option value="TIME_SERIES_MONTHLY" {% if form_data.time_series == 'TIME_SERIES_MONTHLY' %}selected{% endif %}>4. Monthly</option>
                </select>
            </div>
            <div class="form-group">
                <label for="start_date">Start Date:</label>
                <input type="date" name="start_date" id="start_date" value="{{ form_data.start_date }}">
            </div>
            <div class="form-group">
                <label for="end_date">End Date:</label>
                <input type="date" name="end_date" id="end_date" value="{{ form_data.end_date }}">
            </div>
            <button type="submit">Generate Chart</button>
        </form>
        {% if chart_svg %}
        <div class="chart-container">
            {% if chart_svg.startswith('data:') %}
                <embed type="image/svg+xml" src="{{ chart_svg }}" />
            {% else %}
                {{ chart_svg | safe }}
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>
</html>
